
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x validate-data.sh

      - name: Run and verify output
        shell: bash
        run: |
          test_case() {
            expected="$1"
            shift
            output=$(bash validate-data.sh "$@")
            echo "Script output was: $output"

            if [ "$output" = "$expected" ]; then
              echo "Test Passed!"
            else
              echo "Test Failed!"
              exit 1
            fi
          }

          test_case PASS "pearse mccarthy" "0831122334"
          test_case FAIL "pearse mccarthy extra" "0831122334"
          test_case PASS "pearse mccarthy test" "0831122334"
